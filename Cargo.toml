[package]
name = "esp-viewer"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 's'
lto = 'thin'

[dependencies]
bevy_egui = "0.42.0"
js-sys = "0.3.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wgpu-types = "29.0.4"
tes3 = { git = "https://github.com/Greatness7/tes3", features = ["esp", "nif"] }
zip = "8.6.0"

[dependencies.bevy]
version = "0.19.1"
default-features = false
features = [
    "2d",
    "3d",
    "ui",

    # Parts of Bevy:
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_dev_tools",
    "bevy_render",
    "bevy_window",

    # Platform-Specific
    "webgl2",                # Web: use WebGL2 instead of WebGPU

    # Asset File Format Support
    "bmp",
    "dds",
    "tga",
]

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FormData",
    "History",
    "HtmlDocument",
    "HtmlInputElement",
    "Location",
    "Response",
    "Request",
    "RequestInit",
    "Url",
    "UrlSearchParams",
    "Window",
]
